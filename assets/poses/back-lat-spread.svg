<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Terminal window: ./pose --back-lat-spread draws a neon line-art bodybuilder hitting a back lat spread, then cat ~/.gym/pose prints the pose name and its place in the mandatories (5 of 8), then a quote.">
<title>fox@edge :: ./pose --back-lat-spread</title>
<defs>
