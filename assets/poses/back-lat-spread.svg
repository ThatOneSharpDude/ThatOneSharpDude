<g clip-path="url(#q1)"><text x="540" y="288" class="w" font-size="15">“I really attribute my back development to</text></g>
<g clip-path="url(#q2)"><text x="549" y="312" class="w" font-size="15">following the routines of Robby and Roy</text></g>
<g clip-path="url(#q3)"><text x="549" y="336" class="w" font-size="15">Callender.”</text></g>
<g class="in" style="animation-delay:8.7s">
  <text x="556" y="364" class="p">— Lee Haney · NPC News, 2013</text>
</g>
<g class="in" style="animation-delay:9.3s">
  <text x="520" y="410"><tspan class="g bd">$</tspan><tspan class="g blink" font-size="18"> █</tspan></text>
</g>
